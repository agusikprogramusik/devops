replicaCount: 2

image:
  repository: ghcr.io/agusikprogramusik/mcp-knowledge-server
  pullPolicy: IfNotPresent
  tag: "0.2.0"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: "mcp-knowledge-server"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels:
  app.kubernetes.io/part-of: ai-platform

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

containerPort: 8000

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

env:
  - name: HOST
    value: "0.0.0.0"
  - name: MCP_PORT
    value: "8000"
  - name: INGEST_PORT
    value: "8001"
  - name: POSTGRES_HOST
    value: "postgres.mcp.svc.cluster.local"
  - name: POSTGRES_PORT
    value: "5432"
  - name: POSTGRES_DB
    value: "mcp"
  - name: POSTGRES_USER
    value: "mcp"
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-secret
        key: postgres-password
        optional: true
  - name: EMBEDDING_API_URL
    value: "http://mcp-knowledge-server-tei:80"
  - name: EMBEDDING_MODEL
    value: "BAAI/bge-m3"
  - name: EMBEDDING_DIM
    value: "1024"
  - name: STORAGE_BACKEND
    value: "auto"

envFrom:
  - secretRef:
      name: postgres-secret
      optional: true

livenessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: mcp.internal.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mcp-tls-cert
      hosts:
        - mcp.internal.example.com

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Hugging Face TEI (Text Embeddings Inference) Microservice (Method B)
tei:
  enabled: true
  image:
    repository: ghcr.io/huggingface/text-embeddings-inference
    tag: "cpu-latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  modelId: "BAAI/bge-m3"
  port: 80
  resources:
    requests:
      cpu: 500m
      memory: 2.5Gi
    limits:
      cpu: 2000m
      memory: 5Gi

