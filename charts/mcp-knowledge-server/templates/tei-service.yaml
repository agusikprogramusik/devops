{{- if .Values.tei.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.fullname" . }}-tei
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedding-engine
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.tei.port | default 80 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: embedding-engine
{{- end }}
